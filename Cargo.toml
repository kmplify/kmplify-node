[package]
name = "kmplify-node"
version = "0.6.1"
edition = "2021"
# What the dependency floor actually is, now that both lanes ship by default:
# ratatui asks for 1.88 and wasmtime for 1.95. Claiming 1.77 while the tree
# needs 1.95 only turns a clear "update your toolchain" into a wall of
# unresolved-import errors. Operators install release binaries; the people
# who see this are building from source, and they have rustup.
rust-version = "1.95"
description = "Provider agent for the KMPLIFY Compute Fabric: lend a machine's GPU, CPU and local models to a fabric over one outbound connection."
authors = ["KMPLIFY"]
license = "Apache-2.0"
repository = "https://github.com/kmplify/kmplify-node"
homepage = "https://kmplify.io"
readme = "README.md"
keywords = ["gpu", "inference", "ollama", "peer-to-peer", "self-hosted"]
categories = ["command-line-utilities", "network-programming"]

# The catalog's function sources under functions/ are their own tiny crates,
# built for wasm32-wasip1 by functions/build.sh and never as part of the node.
# Excluded explicitly so `cargo test` here does not try to build a WASI
# command for the host.
[workspace]
exclude = ["functions"]

[lib]
name = "kmplify_node"
path = "src/lib.rs"

[[bin]]
name = "kmplify-node"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "process",
    "time",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
    "io-util",
    "signal",
    "fs",
] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# rustls rather than the platform TLS stack so a static-ish binary can be
# dropped onto a headless box without chasing OpenSSL versions.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
# Host CPU/RAM telemetry. Must be read on the host: inside a container the
# usual sources describe the container's VM, not the machine whose capacity
# is being advertised.
sysinfo = "0.32"
sha2 = "0.10.9"
ed25519-dalek = "2.1.1"
# The terminal dashboard (src/tui.rs). Default-on because a headless node
# without one is operated by reading logs; a packager who wants the smallest
# possible service binary can still build with --no-default-features.
# ratatui re-exports the crossterm it was built against, so the terminal
# backend can never be a mismatched second version.
ratatui = { version = "0.30", optional = true }
# The Wasm runtime for the functions lane (src/functions.rs). Both crates
# must share one major version. Kept CURRENT rather than pinned old: this is
# the sandbox that stands between other people's code and an operator's
# machine, and it was 25 majors behind — which is also where the Windows
# trap path was broken.
wasmtime = { version = "48", optional = true, default-features = false, features = ["cranelift", "runtime", "wat"] }
wasmtime-wasi = { version = "48", optional = true, default-features = false, features = ["p1"] }
# The LAN router (src/router): finding the other kmplify-nodes on this
# network. Its own mDNS responder rather than the system's, because Windows
# ships none; shares UDP 5353 with Bonjour and Avahi where they exist.
mdns-sd = { version = "0.21", optional = true }
# The router's listeners (src/router/node_info.rs, proxy.rs): the node-info
# surface peers read, and the two routing proxies. Shares hyper 1 with the
# reqwest already in the tree.
axum = { version = "0.8", optional = true }
# The desktop window (src/gui): the router's screens, drawn natively.
# Opt-in at build time because a GPU-backed window toolkit is a large
# dependency a headless service binary has no use for. The OpenGL backend
# only: it is enough for a dashboard, it is the smaller tree, and eframe's
# wgpu backend does not currently build on Windows in this dependency set.
eframe = { version = "0.36", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[profile.release]
codegen-units = 16
lto = "thin"
strip = true

[features]
# Both lanes ship in the released binaries. The functions lane was optional
# for a year and the result was a fabric where the gateway could sign and
# schedule a function and NOT ONE node could run it: the runtime was absent
# from every build anyone actually installed. A capability that ships turned
# off in every artifact is a capability that does not exist.
default = ["tui", "wasm"]
# `kmplify-node tui`: watch and control the node from a terminal.
tui = ["dep:ratatui"]
# Host signed Wasm functions in an in-process sandbox (wasmtime, WASI p1).
# Costs ~8 MB of binary; hosting functions is still opt-in at RUNTIME
# (PROVIDER_FUNCTIONS, plus a catalog key to trust), so what this decides is
# only whether an operator who opts in has an engine to do it with.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]
# The LAN router: discovery, per-node telemetry and (phase 2) the routing
# proxies. Headless-capable; the window below is one client of it.
router = ["dep:mdns-sd", "dep:axum"]
# `kmplify-node gui`: the desktop window for the router, on Linux, macOS
# and Windows. See docs/ROUTER.md.
gui = ["router", "dep:eframe"]

[dev-dependencies]
wat = "1.243.0"
