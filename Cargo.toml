[package]
name = "kmplify-node"
version = "0.6.1"
edition = "2021"
# What the dependency floor actually is, now that both lanes ship by default:
# ratatui asks for 1.88 and wasmtime for 1.95. Claiming 1.77 while the tree
# needs 1.95 only turns a clear "update your toolchain" into a wall of
# unresolved-import errors. Operators install release binaries; the people
# who see this are building from source, and they have rustup.
rust-version = "1.95"
description = "Provider agent for the KMPLIFY Compute Fabric: lend a machine's GPU, CPU and local models to a fabric over one outbound connection."
authors = ["KMPLIFY"]
license = "Apache-2.0"
repository = "https://github.com/kmplify/kmplify-node"
homepage = "https://kmplify.io"
readme = "README.md"
keywords = ["gpu", "inference", "ollama", "peer-to-peer", "self-hosted"]
categories = ["command-line-utilities", "network-programming"]

# The catalog's function sources under functions/ are their own tiny crates,
# built for wasm32-wasip1 by functions/build.sh and never as part of the node.
# Excluded explicitly so `cargo test` here does not try to build a WASI
# command for the host.
[workspace]
exclude = ["functions"]

[lib]
name = "kmplify_node"
path = "src/lib.rs"

[[bin]]
name = "kmplify-node"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "process",
    "time",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
    "io-util",
    "signal",
    "fs",
] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# rustls rather than the platform TLS stack so a static-ish binary can be
# dropped onto a headless box without chasing OpenSSL versions.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
# Host CPU/RAM telemetry. Must be read on the host: inside a container the
# usual sources describe the container's VM, not the machine whose capacity
# is being advertised.
sysinfo = "0.32"
sha2 = "0.10.9"
ed25519-dalek = "2.1.1"
# The terminal dashboard (src/tui.rs). Default-on because a headless node
# without one is operated by reading logs; a packager who wants the smallest
# possible service binary can still build with --no-default-features.
# ratatui re-exports the crossterm it was built against, so the terminal
# backend can never be a mismatched second version.
ratatui = { version = "0.30", optional = true }
# The Wasm runtime for the functions lane (src/functions.rs). Both crates
# must share one major version. Kept CURRENT rather than pinned old: this is
# the sandbox that stands between other people's code and an operator's
# machine, and it was 25 majors behind — which is also where the Windows
# trap path was broken.
wasmtime = { version = "48", optional = true, default-features = false, features = ["cranelift", "runtime", "wat"] }
wasmtime-wasi = { version = "48", optional = true, default-features = false, features = ["p1"] }
# The LAN router (src/router): finding the other kmplify-nodes on this
# network. Its own mDNS responder rather than the system's, because Windows
# ships none; shares UDP 5353 with Bonjour and Avahi where they exist.
mdns-sd = { version = "0.21", optional = true }
# The router's listeners (src/router/node_info.rs, proxy.rs): the node-info
# surface peers read, and the two routing proxies. Shares hyper 1 with the
# reqwest already in the tree.
axum = { version = "0.8", optional = true }
# Cluster trust (src/router/cluster.rs, tls.rs): a self-signed leaf
# certificate per node, PIN pairing that pins the peer's certificate, and
# mutual TLS on every peer surface. rustls, tokio-rustls, hyper and
# hyper-util are the versions reqwest and axum already link.
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", optional = true, features = ["server-auto", "tokio", "service"] }
tower = { version = "0.5", optional = true }
# SPAKE2: the six-digit PIN authenticates the key exchange, so an active
# man in the middle gets one online guess per attempt and a passive one
# gets nothing to brute-force offline. hmac confirms the transcript.
spake2 = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
hex = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
# The desktop window (src/gui): the router's screens, drawn natively.
# Opt-in at build time because a GPU-backed window toolkit is a large
# dependency a headless service binary has no use for. The OpenGL backend
# only: it is enough for a dashboard, it is the smaller tree, and eframe's
# wgpu backend does not currently build on Windows in this dependency set.
eframe = { version = "0.36", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

# The tray icon behind which the window hides (src/gui/tray.rs). Windows
# and macOS only: on Linux the crate needs GTK and an appindicator library
# at build time and the desktops disagree about trays anyway, so there the
# window closes and a `run --router` service is how the router outlives it.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24", optional = true, default-features = false }

[profile.release]
codegen-units = 16
lto = "thin"
strip = true

[features]
# Both lanes ship in the released binaries. The functions lane was optional
# for a year and the result was a fabric where the gateway could sign and
# schedule a function and NOT ONE node could run it: the runtime was absent
# from every build anyone actually installed. A capability that ships turned
# off in every artifact is a capability that does not exist.
default = ["tui", "wasm"]
# `kmplify-node tui`: watch and control the node from a terminal.
tui = ["dep:ratatui"]
# Host signed Wasm functions in an in-process sandbox (wasmtime, WASI p1).
# Costs ~8 MB of binary; hosting functions is still opt-in at RUNTIME
# (PROVIDER_FUNCTIONS, plus a catalog key to trust), so what this decides is
# only whether an operator who opts in has an engine to do it with.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]
# The LAN router: discovery, per-node telemetry and (phase 2) the routing
# proxies. Headless-capable; the window below is one client of it.
router = [
    "dep:mdns-sd",
    "dep:axum",
    "dep:rcgen",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower",
    "dep:spake2",
    "dep:hmac",
    "dep:hex",
    "dep:rand",
]
# `kmplify-node gui`: the desktop window for the router, on Linux, macOS
# and Windows. See docs/ROUTER.md.
gui = ["router", "dep:eframe", "dep:tray-icon"]

[dev-dependencies]
wat = "1.243.0"

# `cargo deb` (cargo install cargo-deb): the Debian/Ubuntu package with the
# window, the desktop entry, the icon and the systemd unit. The unit is
# installed but not enabled: it runs as the `kmplify` user, which the
# operator creates on purpose (docs/HEADLESS-NODE.md), and a node should
# not start lending before its settings exist.
[package.metadata.deb]
name = "kmplify-node"
maintainer = "KMPLIFY <hallo@kmplify.de>"
# Debian-format changelog, gzipped into usr/share/doc/kmplify-node/. Its top
# entry must carry the version below (lintian checks), so every version bump
# here gets an entry there.
changelog = "packaging/debian/changelog"
copyright = "KMPLIFY"
license-file = ["LICENSE", "0"]
extended-description = """\
Provider agent for the KMPLIFY Compute Fabric: lends a machine's GPU, CPU and \
locally served models to a fabric over one outbound connection, and turns the \
kmplify-nodes on one local network into a personal inference cluster with a \
desktop window (kmplify-node gui) or a terminal dashboard (kmplify-node tui)."""
section = "net"
priority = "optional"
depends = "$auto, libgl1"
recommends = "docker.io | docker-ce"
features = ["gui"]
assets = [
    ["target/release/kmplify-node", "usr/bin/", "755"],
    ["packaging/kmplify-node.desktop", "usr/share/applications/", "644"],
    ["packaging/kmplify-node.1", "usr/share/man/man1/", "644"],
    ["packaging/icons/kmplify-node.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["packaging/kmplify-node.service", "usr/lib/systemd/system/", "644"],
    ["packaging/kmplify-node.env.example", "usr/share/doc/kmplify-node/", "644"],
    ["README.md", "usr/share/doc/kmplify-node/", "644"],
    ["NOTICE", "usr/share/doc/kmplify-node/", "644"],
    ["docs/*.md", "usr/share/doc/kmplify-node/docs/", "644"],
]
