# cargo-deny: keep the dependency tree shippable inside commercial products.
#
# The node is Apache-2.0 and is embedded in closed KMPLIFY products, so a
# copyleft dependency would break both at once. Caught in CI rather than during
# an acquisition's due diligence, which is where these are usually found.

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",       # file-level copyleft only; safe to link, safe to ship
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
# Never, at any version, under any feature flag.
deny = []

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
