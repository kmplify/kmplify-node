# Build and publish kmplify-node for every platform an operator installs on,
# on each version tag: static musl binaries for Linux (x86_64 + aarch64, the
# two shapes a PC/VPS/server fleet actually has), both macOS architectures,
# and Windows. Attaches SHA256SUMS (what scripts/install.sh verifies against)
# plus the systemd unit and env template the installer's --service path
# fetches, and pushes the multi-arch inference-only runtime image to
# ghcr.io/kmplify/kmplify-node.
#
# Alongside the bare binaries, the desktop packages: a Debian/Ubuntu .deb
# with the window, the desktop entry and the icon (glibc, since the window
# toolkit loads the display libraries at runtime); a macOS .dmg per
# architecture with "KMPLIFY Node.app"; a Windows installer. The macOS and
# Windows binaries are built with the `gui` feature, so `kmplify-node gui`
# works from the bare download too; the musl binaries stay headless.
#
# The release is created as a draft and published only when every artifact is
# attached, so an installer running mid-release can never see a half-uploaded
# asset list.
name: Release

# Two ways in, one release:
#   * a `vX.Y.Z` tag, pushed by hand (the manual path, kept for hotfixes);
#   * a push to main that changes Cargo.toml, where the crate version is
#     read and released automatically under `v<version>` if no such tag
#     exists yet. Bumping `version` in Cargo.toml and merging IS the release
#     action, so nobody has to remember the tag step, and a tag can never
#     name a version the manifest does not carry.
#
# The `resolve` job decides; everything else keys off its outputs so a push
# to main for an already-released version is a no-op rather than a failed
# or duplicated release.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["Cargo.toml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
             || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing $tag from main"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl + rustls: fully static, zero runtime deps. If the kernel
          # runs, the binary runs, which is the whole 24/7 fleet story.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            features: ""
            package: none
          # Native ARM runner rather than cross-compiling: free for public
          # repos, and a native build cannot lie about linker behaviour.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            features: ""
            package: none
          # The desktop packages: glibc builds with the window.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            features: gui
            package: deb
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            features: gui
            package: deb
          - target: aarch64-apple-darwin
            runner: macos-latest
            features: gui
            package: dmg
          - target: x86_64-apple-darwin
            runner: macos-latest
            features: gui
            package: dmg
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            features: gui
            package: inno
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Linux display libraries (build-time headers for the window toolkit)
        if: matrix.package == 'deb'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.features }}" ]]; then
            cargo build --release --target ${{ matrix.target }} --features ${{ matrix.features }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Name the artifact after its target
        if: matrix.package != 'deb'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          case "${{ matrix.target }}" in
            *windows*) cp "target/${{ matrix.target }}/release/kmplify-node.exe" "out/kmplify-node-${{ matrix.target }}.exe" ;;
            *)         cp "target/${{ matrix.target }}/release/kmplify-node"     "out/kmplify-node-${{ matrix.target }}" ;;
          esac
      # cargo-deb builds the release binary itself with the features the
      # manifest's [package.metadata.deb] names, and lays the assets out.
      - name: Debian package
        if: matrix.package == 'deb'
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          cargo deb --target ${{ matrix.target }} --no-build --output out/ || {
            # --no-build wants the binary under target/<triple>/release, which
            # the Build step made; a missing one means fall back to a build.
            cargo deb --target ${{ matrix.target }} --output out/
          }
          ls -l out/
      - name: macOS app bundle and disk image
        if: matrix.package == 'dmg'
        run: |
          set -euo pipefail
          scripts/bundle-macos.sh "target/${{ matrix.target }}/release/kmplify-node" "${{ needs.resolve.outputs.tag }}" "out/kmplify-node-${{ needs.resolve.outputs.tag }}-${{ matrix.target }}.dmg"
      # Inno Setup ships on the hosted Windows runners.
      - name: Windows installer
        if: matrix.package == 'inno'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = (Resolve-Path "target/${{ matrix.target }}/release").Path
          iscc "/DAppVersion=${{ needs.resolve.outputs.version }}" "/DSourceDir=$src" "/Oout" packaging\windows\kmplify-node.iss
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # Inference-only runtime image, one manifest covering amd64 + arm64, built
  # from the SAME binaries the release ships rather than compiled a second
  # time (a second compile is a second chance to differ from what SHA256SUMS
  # attests).
  docker:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*-linux-musl
          path: artifacts
      - name: Lay out per-arch binaries for the Dockerfile
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          cp artifacts/bin-x86_64-unknown-linux-musl/kmplify-node-x86_64-unknown-linux-musl dist/amd64/kmplify-node
          cp artifacts/bin-aarch64-unknown-linux-musl/kmplify-node-aarch64-unknown-linux-musl dist/arm64/kmplify-node
          chmod 755 dist/*/kmplify-node
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kmplify/kmplify-node:${{ needs.resolve.outputs.tag }}
            ghcr.io/kmplify/kmplify-node:latest

  release:
    needs: [resolve, build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - name: Assemble assets and SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/kmplify-node* release/
          # What install.sh --service fetches, versioned with the binaries so
          # unit and binary can never skew.
          cp packaging/kmplify-node.service release/
          cp packaging/kmplify-node.env.example release/
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # Draft first. `install.sh` resolves `releases/latest` and then fetches
      # SHA256SUMS, so a release that exists while its assets are still
      # uploading is a real failure window: the installer would find the
      # version, fail to verify it, and refuse to install. A draft is not
      # "latest", so that window cannot be observed.
      # `tag_name` + `target_commitish` create the tag when the run came
      # from main (the automatic path) and simply match it when the run came
      # from a pushed tag.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
      # Everything is attached by here; flip it live in one step.
      - name: Publish once every asset is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.resolve.outputs.tag }}" --draft=false --repo "${{ github.repository }}"
