name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  # The released binary actually starts: `run --ui gui` against a gateway
  # that is not there reaches the dashboard and keeps running, on every OS,
  # with Docker as it is, with a docker and nvidia-smi that never answer,
  # and with a Docker whose daemon is not running (the Windows report of
  # 2026-11-23: the node ended without a word while Docker Desktop was off).
  smoke-start:
    name: smoke start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: plain, hang, down (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          rc=0
          for v in plain hang down; do
            scripts/smoke-start.sh target/release/kmplify-node "$v" || rc=1
          done
          exit $rc
      - name: plain, hang, down (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $rc = 0
          foreach ($v in 'plain', 'hang', 'down') {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\smoke-start.ps1 -Bin target\release\kmplify-node.exe -Variant $v
            if ($LASTEXITCODE -ne 0) { $rc = 1 }
          }
          exit $rc
      # Diagnostic only: the released v0.9.0 on the same runner, to tell
      # "every Windows" from "that one machine". Its first line predates the
      # node-dir wording, so that check fails by design; what matters is
      # whether it is alive at 20 s, and its exit code if not.
      - name: released v0.9.0 for comparison (Windows, diagnostic)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.9.0 --repo ${{ github.repository }} --pattern 'kmplify-node-0.9.0-x86_64-pc-windows-msvc.exe' --dir old
          foreach ($v in 'plain', 'down') {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\smoke-start.ps1 -Bin old\kmplify-node-0.9.0-x86_64-pc-windows-msvc.exe -Variant $v
          }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      # What kmplify-desktop embeds, and what the static release binaries
      # build: both must stay clean without the window (and the first
      # without the router and the views).
      - run: cargo clippy --no-default-features --features provider-core
      - run: cargo clippy --all-targets --no-default-features --features tui,wasm,dashboard,router

  # The whole point of the repository is that nothing copyleft ends up in a
  # binary people run on their own machines, and that the licence stays
  # compatible with shipping this inside commercial products.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # Known vulnerabilities in the dependency tree. deny.toml has carried an
  # [advisories] section all along and nothing ran it, so an RUSTSEC advisory
  # against a crate this agent links could sit in the tree unnoticed. That
  # matters more here than in most repositories: this binary runs on other
  # people's machines and accepts work from a network.
  #
  # Its own job on purpose. An advisory published upstream can turn this red
  # without anybody touching the code, and when that happens the licence and
  # ban checks should still report their own verdicts rather than be hidden
  # behind one shared red X.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  signoff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off (CLA.md)
        run: |
          missing=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha has no Signed-off-by line (see CLA.md; use git commit -s)"
              missing=1
            fi
          done
          exit $missing
